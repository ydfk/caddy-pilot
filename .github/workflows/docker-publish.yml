name: 发布 Docker 镜像与 Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.11
          cache-dependency-path: |
            backend/go.sum
            caddy-modules/alidns/go.sum

      - name: 测试后端与 Caddy 模块
        run: |
          cd backend && go test ./...
          cd ../caddy-modules/alidns && go test ./...

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 测试并构建前端
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test:run
          pnpm build

  publish:
    name: 构建、推送并创建 Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验版本标签
        id: version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "仅允许 v1.2.3 或 v1.2.3-rc.1 格式的标签"
            exit 1
          fi
          [[ "${GITHUB_REF_NAME}" == *-* ]] && prerelease=true || prerelease=false
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "stable=$([[ $prerelease == false ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/caddy-pilot
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable }}

      - name: 构建并推送 amd64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.11
          cache: false

      - name: 准备 Caddy 运行时资产
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/caddy-pilot:${{ steps.version.outputs.version }}
          CADDY_VERSION: 2.11.4
        run: |
          mkdir -p dist/linux dist/windows
          docker pull "$IMAGE"
          container=$(docker create "$IMAGE")
          docker cp "$container:/usr/bin/caddy" dist/linux/caddy
          docker rm "$container"
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.5
          GOOS=windows GOARCH=amd64 xcaddy build v2.11.4 \
            --output dist/windows/caddy.exe \
            --with github.com/caddy-dns/alidns="$(pwd)/caddy-modules/alidns"
          chmod 0755 dist/linux/caddy
          tar -C dist/linux -czf "dist/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" caddy
          (cd dist/windows && zip -9 "../caddy_${CADDY_VERSION}_windows_amd64.zip" caddy.exe)
          rm -rf dist/linux dist/windows
          cp docker-compose.prod.yml dist/docker-compose.prod.yml
          (cd dist && sha512sum caddy_* > sha512sums.txt)
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > dist/caddy-runtime-manifest.json <<EOF
          {
            "version": "2.11.4",
            "release_tag": "${GITHUB_REF_NAME}",
            "assets": {
              "linux_amd64": {"url": "${base}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz", "format": "tar.gz"},
              "windows_amd64": {"url": "${base}/caddy_${CADDY_VERSION}_windows_amd64.zip", "format": "zip"}
            },
            "sha512_url": "${base}/sha512sums.txt",
            "required_modules": ["dns.providers.alidns"]
          }
          EOF

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "CaddyPilot ${GITHUB_REF_NAME}" \
              --prerelease="$PRERELEASE"
          elif [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$GITHUB_REF_NAME" --title "CaddyPilot ${GITHUB_REF_NAME}" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --title "CaddyPilot ${GITHUB_REF_NAME}" --generate-notes --latest
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
